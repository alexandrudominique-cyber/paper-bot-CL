name: paper-bot

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the paper bot
        run: python paper_bot.py
      - name: Save the bot memory
        run: |
          git config user.name  "paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add portfolio_state.json trades_log.csv STATUS.md
          git commit -m "paper bot run" || echo "nothing to commit"
          git push
